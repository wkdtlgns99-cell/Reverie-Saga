name: Native checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.12"
          architecture: x64
      - name: Install exact qualified tool closure
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Shared and selective lint
        run: |
          python -m ruff check src tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check --config ruff-quality.toml src tests
      - name: Scoped formatting
        run: python -m ruff format --check src/orchestration/turn.py src/contracts/encounter.py src/engines/encounter.py tests/replay/test_encounter.py src/contracts/client.py src/app/client.py src/app/client_session.py src/app/client_worker.py tests/integration/test_client.py
      - name: Strict types
        run: python -m mypy --no-native-parser
      - name: Type-inclusive dependency contracts
        run: python -c "from importlinter.cli import lint_imports_command; lint_imports_command()" --config pyproject.toml --no-cache
      - name: Runtime sibling-cycle contract
        run: python -c "from importlinter.cli import lint_imports_command; lint_imports_command()" --config .importlinter-runtime.toml --no-cache
      - name: Full regression including goldens
        run: python -m pytest -q --basetemp .pytest_cache/ci-run
