[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
required-version = "==0.16.6"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E722", "S110", "S112", "BLE001", "TID251", "PLW0603", "RUF012", "B006", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"src/orchestration/turn.py" = ["BLE001", "TID251"]
"src/app/*.py" = ["TID251"]
"src/orchestration/rng.py" = ["TID251"]
"src/orchestration/replay.py" = ["TID251"]
"tests/unit/*.py" = ["TID251"]
"tests/integration/*.py" = ["TID251"]
"tests/replay/*.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Use scoped deterministic RNG in core/engines."
"time".msg = "Use logical ticks in core/engines."
"uuid".msg = "Use canonical semantic identity in core/engines."
"os.environ".msg = "Environment belongs at app/adapter boundary."
"os.getenv".msg = "Environment belongs at app/adapter boundary."
"builtins.open".msg = "Filesystem belongs at app/adapter boundary."
"pathlib.Path.open".msg = "Filesystem belongs at app/adapter boundary."
"unittest.mock".msg = "Do not mock domain/engine outcomes."
"pytest_mock".msg = "Do not mock domain/engine outcomes."

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
namespace_packages = true
files = ["src", "tests"]
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"

# GOV-02 active: type-inclusive layers, engine independence and named external bans.
[tool.importlinter]
root_packages = ["app", "adapters", "orchestration", "engines", "contracts", "domain"]
include_external_packages = true
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = "rs-layers"
name = "Reverie Saga six internal layers"
type = "layers"
layers = ["app", "adapters", "orchestration", "engines", "contracts", "domain"]

[[tool.importlinter.contracts]]
id = "rs-engines-independent"
name = "Reverie Saga concrete engine modules are independent"
type = "independence"
modules = ["engines.skeleton", "engines.trial", "engines.encounter", "engines.watch"]

[[tool.importlinter.contracts]]
id = "rs-core-no-external-effects"
name = "Reverie Saga core avoids named SDK IO and developer-tool imports"
type = "forbidden"
source_modules = ["domain", "contracts", "engines"]
forbidden_modules = [
    "aiohttp",
    "anthropic",
    "ast_serialize",
    "asyncio",
    "click",
    "colorama",
    "coverage",
    "ctypes",
    "datetime",
    "google",
    "godot",
    "grimp",
    "http",
    "httpx",
    "importlib",
    "importlinter",
    "iniconfig",
    "io",
    "librt",
    "markdown_it",
    "mdurl",
    "multiprocessing",
    "mypy",
    "mypy_extensions",
    "ollama",
    "openai",
    "os",
    "packaging",
    "pathlib",
    "pathspec",
    "pluggy",
    "production",
    "pygame",
    "pygments",
    "PySide6",
    "pytest",
    "pytest_mock",
    "random",
    "requests",
    "rich",
    "ruff",
    "secrets",
    "shutil",
    "socket",
    "sqlite3",
    "subprocess",
    "sys",
    "tempfile",
    "threading",
    "time",
    "tools",
    "typing_extensions",
    "unittest",
    "unity",
    "urllib",
    "uuid",
]
allow_indirect_imports = false
as_packages = true

